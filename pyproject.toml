[project]
name = "series-sync"
version = "0.1.0"
description = "Automate Dubbing und Synchronisation von Serien/Filmen"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic[dotenv]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "redis",
    "python-multipart",
    "python-dotenv",
    "alembic",
    "celery",
    "FFmpeg",
    "whisper",
    "torch",
    "torchaudio",
    "numpy",
    "opencv-python",
    "deep-translator",
    "elevenlabs",
    "openai",
    "pydub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]
