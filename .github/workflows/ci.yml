name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest -q
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: seriessync
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Migrate as owner, create non-owner app role
        run: |
          DATABASE_URL=postgresql+asyncpg://owner:owner@localhost:5432/seriessync alembic upgrade head
          PGPASSWORD=owner psql -h localhost -U owner -d seriessync -c "CREATE ROLE app LOGIN PASSWORD 'app'; GRANT USAGE ON SCHEMA public TO app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app;"
      - name: RLS tests as app role
        run: DATABASE_URL=postgresql+asyncpg://app:app@localhost:5432/seriessync pytest -q tests/test_rls.py
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t app:ci .
